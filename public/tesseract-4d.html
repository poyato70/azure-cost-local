<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tesseract - Hipercubo 4D</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #090b16; height: 100%; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 12px; left: 12px;
    color: rgba(200,196,240,0.8); font-family: monospace; font-size: 12px;
    pointer-events: none; line-height: 1.5;
  }
</style>
</head>
<body>
<div id="info">Arraste para orbitar · Scroll para zoom</div>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
if(!window.THREE){document.getElementById('info').textContent='Visualização 4D indisponível: CDN Three.js não carregou. Feche a janela para continuar.';throw new Error('Three.js unavailable');}

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x090b16, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 8);

// ======================================================================
// MATEMÁTICA DA PROJEÇÃO 4D -> 3D
// ======================================================================
// Um tesseract tem 16 vértices, cada um com coordenadas (x, y, z, w)
// onde cada componente vale +1 ou -1 (hipercubo unitário em 4D).
//
// Para "rotacionar" o objeto de forma que pareça um cubo se contorcendo
// dentro de outro cubo, giramos os vértices em planos que envolvem a
// 4ª dimensão (W) — por exemplo o plano XW ou o plano YW — e não apenas
// nos planos 3D tradicionais (XY, XZ, YZ).
//
// Rotação no plano XW por um ângulo "a":
//   x' = x*cos(a) - w*sin(a)
//   w' = x*sin(a) + w*cos(a)
//   (y e z permanecem inalterados)
//
// Depois de rotacionar em 4D, projetamos de volta para 3D usando uma
// projeção em perspectiva simples sobre a coordenada W:
//   factor = 1 / (distanciaCamera4D - w)
//   x3d = x * factor
//   y3d = y * factor
//   z3d = z * factor
//
// W maior aproxima o vértice do ponto de projeção 4D: o denominador
// diminui e sua projeção cresce. W menor gera a camada interna menor de um
// cubo menor dentro de um cubo maior, que se deforma continuamente
// conforme o ângulo de rotação muda.
// ======================================================================

// Gera os 16 vértices do tesseract: todas as combinações de +-1 em 4 eixos
const vertices4D = [];
for (let x = -1; x <= 1; x += 2)
  for (let y = -1; y <= 1; y += 2)
    for (let z = -1; z <= 1; z += 2)
      for (let w = -1; w <= 1; w += 2)
        vertices4D.push([x, y, z, w]);

// Gera as arestas: dois vértices são conectados se diferem em exatamente
// uma coordenada (propriedade estrutural de um hipercubo)
const edges = [];
for (let i = 0; i < vertices4D.length; i++) {
  for (let j = i + 1; j < vertices4D.length; j++) {
    let diff = 0;
    for (let k = 0; k < 4; k++) {
      if (vertices4D[i][k] !== vertices4D[j][k]) diff++;
    }
    if (diff === 1) edges.push([i, j]);
  }
}
// Um tesseract tem 16 vértices e 32 arestas

function rotate4D(v, angleXW, angleYW, angleZW) {
  let [x, y, z, w] = v;

  // Rotação no plano XW
  let cx = Math.cos(angleXW), sx = Math.sin(angleXW);
  let x1 = x * cx - w * sx;
  let w1 = x * sx + w * cx;

  // Rotação no plano YW
  let cy = Math.cos(angleYW), sy = Math.sin(angleYW);
  let y1 = y * cy - w1 * sy;
  let w2 = y * sy + w1 * cy;

  // Rotação no plano ZW
  let cz = Math.cos(angleZW), sz = Math.sin(angleZW);
  let z1 = z * cz - w2 * sz;
  let w3 = z * sz + w2 * cz;

  return [x1, y1, z1, w3];
}

function project4Dto3D(v, distancia4D) {
  const [x, y, z, w] = v;
  const factor = 1 / (distancia4D - w);
  return new THREE.Vector3(x * factor, y * factor, z * factor);
}

// ---------- Geometria das linhas (arestas) ----------
const SCALE = 2.2;
const lineGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(edges.length * 2 * 3);
lineGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const lineMaterial = new THREE.LineBasicMaterial({
  color: 0x9886ff,
  linewidth: 2,
  transparent: true,
  opacity: 0.9,
});
const edgeLines = new THREE.LineSegments(lineGeometry, lineMaterial);
scene.add(edgeLines);

// Pontos nos vértices (para destacar os cantos, como na referência)
const pointGeometry = new THREE.BufferGeometry();
const pointPositions = new Float32Array(vertices4D.length * 3);
pointGeometry.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
const pointMaterial = new THREE.PointsMaterial({ color: 0x9886ff, size: 0.09 });
const pointCloud = new THREE.Points(pointGeometry, pointMaterial);
scene.add(pointCloud);

function updateTesseract(t) {
  const angleXW = t * 0.35;
  const angleYW = t * 0.21;
  const angleZW = t * 0.13;
  const distancia4D = 2.5;

  const projected = vertices4D.map(v => {
    const rotated = rotate4D(v, angleXW, angleYW, angleZW);
    return project4Dto3D(rotated, distancia4D).multiplyScalar(SCALE);
  });

  const posArr = lineGeometry.attributes.position.array;
  edges.forEach(([i, j], idx) => {
    const a = projected[i], b = projected[j];
    posArr[idx * 6 + 0] = a.x; posArr[idx * 6 + 1] = a.y; posArr[idx * 6 + 2] = a.z;
    posArr[idx * 6 + 3] = b.x; posArr[idx * 6 + 4] = b.y; posArr[idx * 6 + 5] = b.z;
  });
  lineGeometry.attributes.position.needsUpdate = true;

  const pArr = pointGeometry.attributes.position.array;
  projected.forEach((p, idx) => {
    pArr[idx * 3 + 0] = p.x; pArr[idx * 3 + 1] = p.y; pArr[idx * 3 + 2] = p.z;
  });
  pointGeometry.attributes.position.needsUpdate = true;
}

// ---------- Controle de câmera (órbita manual via mouse/touch) ----------
let radius = 8, theta = 0.5, phi = Math.PI / 2.4;
let dragging = false, lastX = 0, lastY = 0;

function updateCamera() {
  camera.position.set(
    radius * Math.sin(phi) * Math.sin(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(0, 0, 0);
}
updateCamera();

canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  theta -= dx * 0.006;
  phi = THREE.MathUtils.clamp(phi - dy * 0.006, 0.1, Math.PI - 0.1);
});
canvas.addEventListener('wheel', e => {
  radius = THREE.MathUtils.clamp(radius + e.deltaY * 0.01, 3, 20);
  e.preventDefault();
}, { passive: false });

let lastTouchDist = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging) {
    const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    theta -= dx * 0.007;
    phi = THREE.MathUtils.clamp(phi - dy * 0.007, 0.1, Math.PI - 0.1);
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (lastTouchDist !== null) radius = THREE.MathUtils.clamp(radius - (dist - lastTouchDist) * 0.02, 3, 20);
    lastTouchDist = dist;
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = false; lastTouchDist = null; });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if(document.hidden) return;
  updateTesseract(window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : clock.getElapsedTime());
  updateCamera();
  renderer.render(scene, camera);
}
// Renderiza uma primeira projeção mesmo quando o navegador abre o frame oculto.
updateTesseract(0);
updateCamera();
renderer.render(scene, camera);
document.getElementById("info").dataset.ready = "true";
animate();
</script>
</body>
</html>
